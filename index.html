<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Push Notifications</title>
</head>
<body>

    <h1>Push Notifications</h1>

    <button onclick="enable()">Enable Notifications</button>
    <br><br>
    <button id="btns" onclick="notify('Success', 'It worked!')" disabled>Send Notification</button>

    <p id="msg"></p>

    <script>
        function enable() {
            Notification.requestPermission().then(p => {
                if (p === 'granted') {
                    document.getElementById('btns').disabled = false;
                    document.getElementById('msg').innerText = 'Ready! Click the button.';
                    new Notification('Enabled!', { body: 'Notifications are now active.' });
                } else {
                    document.getElementById('msg').innerText = 'Permission denied.';
                }
            });
        }

        function notify(title, body) {
            new Notification(title, { body: body });
        }

        notify('Dup','Yoirm')
    </script>

</body>
</html>
